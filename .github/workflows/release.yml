name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: go test ./...

      # The server does not embed the frontend, it serves web/dist from disk,
      # so every archive carries the built site next to the binary.
      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build the archives
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG:-$(git describe --tags --always)}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            stage="dist/stage"
            rm -rf "$stage"
            mkdir -p "$stage/web"
            bin="battlesight"
            if [ "$goos" = "windows" ]; then
              bin="battlesight.exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w" -o "$stage/$bin" ./cmd/battlesight
            cp -R web/dist "$stage/web/dist"
            cp LICENSE README.md "$stage/"
            name="battlesight_${version#v}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -qr "../${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "$stage" .
            fi
          done
          rm -rf dist/stage
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Attach the archives to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
